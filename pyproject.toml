[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evaluation-lab"
version = "0.1.0"
description = "Structured, deterministic evaluation of AI model responses with QA-style reporting."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
# No runtime dependencies: the framework uses only the standard library.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
evaluation-lab = "evaluation_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Lets tests import the package from src/ even without `pip install -e .`
pythonpath = ["src"]
